# Windows installer (npm run dist → release/). The app is the built out/ folder; ffmpeg and ffprobe
# go next to it in resources/ffmpeg (they run as separate processes, so not inside the asar).
appId: com.courtendvb.volleyreel
productName: volley-reel
copyright: courtendvb
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: vendor/ffmpeg/bin
    to: ffmpeg
    filter:
      - ffmpeg.exe
      - ffprobe.exe
  # The ffmpeg build is GPL: its license and notes ship next to it.
  - from: vendor/ffmpeg
    to: ffmpeg
    filter:
      - LICENSE
      - README.txt
  # League player photos (shared/pack.ts), shipped with the app; not in the repository (vendor/).
  - from: vendor/packs
    to: packs
asar: true
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: volley-reel
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false # installs for the current user: no administrator rights needed
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: volley-reel
  artifactName: volley-reel-setup-${version}.${ext}
# Updates for installed copies (src/main/updater.ts): `npm run release` uploads the installer and
# latest.yml to this public repository's releases; the app's source stays in the private one.
publish:
  provider: github
  owner: courtendvb
  repo: volley-reel-releases
  releaseType: release # published at once (a draft would not be seen by the apps)
