# The Mac app, unsigned: built only by hand (Actions → Mac build → Run workflow) or when a pull
# request touches how it is put together, because macOS runners use up Actions minutes ten times as
# fast. The .dmg files stay on the run's page for 14 days. Nothing is published.
name: Mac build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/mac.yml
      - electron-builder.yml
      - scripts/fetch-ffmpeg-mac.mjs
      - src/main/ffmpegPath.ts
      - src/main/macMenu.ts
      - src/main/macUpdate.ts
      - src/main/updater.ts
jobs:
  build:
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # electron-builder skips signing on pull requests, which leaves the app's signature broken. The
      # signature here is ad-hoc, so this job holds no signing secrets for that rule to protect.
      CSC_FOR_PULL_REQUEST: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run ffmpeg:mac
      - run: npm run dist:mac
      - name: Check the packaged app and its ffmpeg
        run: |
          app="release/mac-arm64/SyncScout Video Editor.app"
          codesign --verify --deep --strict "$app"
          "$app/Contents/Resources/ffmpeg/ffprobe" -version
          "$app/Contents/Resources/ffmpeg/ffmpeg" -hide_banner -f lavfi -i testsrc=d=1 -c:v libx264 -pix_fmt yuv420p "$RUNNER_TEMP/check.mp4"
      - name: Check the update zips unpack to a valid app (as macUpdate.ts unpacks them)
        run: |
          for z in release/*-mac.zip; do
            d="$RUNNER_TEMP/unzip-$(basename "$z" .zip)"
            ditto -x -k "$z" "$d"
            codesign --verify --deep --strict "$d/SyncScout Video Editor.app"
            echo "ok $z"
          done
      - name: Check the product site's Terminal install line (site/index.html; keep the two the same)
        shell: zsh {0}
        run: |
          cd /tmp && a=$(uname -m | sed s/x86_64/x64/) && u=$(curl -fsSL "https://api.github.com/repos/courtendvb/syncscout-video-editor-releases/releases?per_page=30" | grep -o "https://[^\"]*-$a-mac.zip" | head -n 1) && curl -fL "$u" -o ssve.zip && rm -rf ssve && ditto -x -k ssve.zip ssve && rm -rf "/Applications/SyncScout Video Editor.app" && mv "ssve/SyncScout Video Editor.app" /Applications/ && open "/Applications/SyncScout Video Editor.app"
          app="/Applications/SyncScout Video Editor.app"
          codesign --verify --deep --strict "$app"
          ! xattr -p com.apple.quarantine "$app" 2>/dev/null
          sleep 10
          pgrep -f "SyncScout Video Editor.app/Contents/MacOS" >/dev/null || { echo "the app did not start"; exit 1; }
          pkill -f "SyncScout Video Editor.app/Contents/MacOS" || true
      - uses: actions/upload-artifact@v4
        with:
          name: syncscout-video-editor-mac
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml
