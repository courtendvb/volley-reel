# Type check, unit tests and a production build of both editions on every push and pull request. Windows, like the
# app's users; Electron's own binary isn't needed for any of these, so it isn't downloaded.
name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # The sold edition: nothing of the internal one in it (src/internal/README.md)
      - run: node scripts/edition-guard.mjs
      - run: npx electron-vite build
        env:
          VR_EDITION: internal
      - run: node scripts/edition-guard.mjs --internal
